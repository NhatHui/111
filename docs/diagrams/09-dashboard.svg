ke-width="2" filter="url(#shadow)"/><text x="587.5" y="433" text-anchor="middle" font-size="23" font-weight="700" fill="#245745">5. Cập nhật đơn</text><path d="M808 450 L740 450" fill="none" stroke="#477c65" stroke-width="4" marker-end="url(#arrow)"/><rect x="65" y="390" width="295" height="120" rx="18" fill="#fff" stroke="#b7d0bd" stroke-width="2" filter="url(#shadow)"/><text x="212.5" y="433" text-anchor="middle" font-size="23" font-weight="700" fill="#245745">6. Đẩy WebSocket</text><path d="M433 450 L365 450" fill="none" stroke="#477c65" stroke-width="4" marker-end="url(#arrow)"/></g><text x="65" y="640" font-family="Arial,sans-serif" font-size="17" fill="#596e61">REST API dùng token; dashboard cập nhật thông tin theo quyền.</text></svg>